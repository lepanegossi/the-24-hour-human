# Publica o dashboard em https://lepanegossi.github.io/the-24-hour-human/
#
# O nome do dash na URL vem do NOME DO REPOSITORIO, e o Pages serve a raiz do
# site, nao uma subpasta. Como a fonte vive em the-24-hour-human/, servir o repo
# direto repetiria o nome no caminho. Aqui o artefato publicado E essa pasta, com
# dashboard.html copiado como index.html.
#
# Roda o build no CI em vez de publicar o HTML commitado, de proposito: assim a
# pagina no ar e sempre o que build_dashboard.py produz a partir dos CSVs, e nao
# uma versao que alguem esqueceu de regerar.
name: Publish dashboard to Pages

on:
  push:
    # o mesmo workflow roda em dois repos: a fonte, em redesign-visuals, e a
    # vitrine da organizacao, em main
    branches: [main, redesign-visuals]
    paths:
      - "the-24-hour-human/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicacao por vez, sem cancelar a que ja esta em voo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_dashboard.py usa so a biblioteca padrao, entao nao ha o que instalar
      - name: Build the dashboard
        working-directory: the-24-hour-human
        run: |
          python3 build_dashboard.py
          test -s dashboard.html

      - name: Lay out the site root
        working-directory: the-24-hour-human
        run: |
          cp dashboard.html index.html
          # marca de qual commit gerou esta pagina, para o passo de verificacao
          # poder confirmar que foi ESTE build que chegou ao ar, e nao o anterior
          sed -i "s#</head>#<meta name=\"build\" content=\"$GITHUB_SHA\">\n</head>#" index.html
          grep -q "$GITHUB_SHA" index.html
          # sem isso o Pages passa o site pelo Jekyll, que ignora pasta com _
          touch .nojekyll
          # o que e fonte nao precisa ir para o ar
          rm -f build_dashboard.py make_captions.py
          rm -rf __pycache__

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: the-24-hour-human

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # O Pages deste repo demora mais que os 10 minutos que esta acao espera, e o
      # maximo que ela aceita e justamente 10, entao o timeout dela nao e sinal de
      # falha: o deploy chega ao ar depois. Em vez de confiar no passo, o passo
      # seguinte confere o site.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Confirm the live site is serving this build
        run: |
          # a URL nao pode ser fixa: o mesmo workflow roda em dois repos. Um repo
          # chamado <conta>.github.io serve na raiz da conta; qualquer outro serve
          # sob o proprio nome.
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          if [ "$repo" = "$owner.github.io" ]; then
            url="https://$owner.github.io/"
          else
            url="https://$owner.github.io/$repo/"
          fi
          echo "verificando $url"
          for i in $(seq 1 90); do
            if curl -fsS --max-time 20 "$url" | grep -q "$GITHUB_SHA"; then
              echo "live after $((i * 20))s: $url"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$url is not serving $GITHUB_SHA after 30 minutes"
          exit 1
